<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para você 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Tela inicial */
#inicio {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    transition: opacity 1s;
}

#inicio h1 {
    color: #ff8fab;
    font-size: 30px;
    margin-bottom: 25px;
    text-align: center;
    text-shadow: 0 0 15px #ff4f81;
}

button {
    border: none;
    background: #ff4f81;
    color: white;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 20px #ff4f81;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
}

/* Conteúdo */
#conteudo {
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* Coração */
.heart {
    position: relative;
    width: 600px;
    height: 520px;
    animation: heartbeat 1.5s infinite;
}

/* Frases */
.text {
    position: absolute;
    color: #ff9fba;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    text-shadow:
        0 0 5px #ff4f81,
        0 0 10px #ff4f81,
        0 0 18px #ff4f81;
}

/* Pulso */
@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }
}

/* Mensagem */
#mensagem {
    position: absolute;
    bottom: 8%;
    width: 90%;
    text-align: center;
    color: #fff;
    font-size: 22px;
    opacity: 0;
    animation: aparecer 3s forwards;
    animation-delay: 2s;
    text-shadow: 0 0 10px #ff4f81;
}

@keyframes aparecer {
    to {
        opacity: 1;
    }
}

/* Celular */
@media (max-width: 600px) {

    .heart {
        transform: scale(.58);
    }

    #mensagem {
        font-size: 18px;
        bottom: 7%;
    }

    #inicio h1 {
        font-size: 25px;
        padding: 20px;
    }
}
</style>
</head>

<body>

<!-- Tela inicial -->
<div id="inicio">

    <h1>
        Tenho uma coisa para te mostrar... 💗
    </h1>

    <button onclick="abrir()">
        Clique aqui ❤️
    </button>

</div>


<!-- Página principal -->
<div id="conteudo">

    <div class="heart" id="heart"></div>

    <div id="mensagem">
        Feito especialmente para você. 💗
    </div>

</div>


<script>

const heart = document.getElementById("heart");

/*
    Equação matemática do coração
*/
const quantidade = 150;

for (let i = 0; i < quantidade; i++) {

    const t = (Math.PI * 2 * i) / quantidade;

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const texto = document.createElement("div");

    texto.className = "text";

    texto.innerText = "I Love You";

    /*
        Posicionamento do texto
    */
    texto.style.left =
        `${300 + x * 16}px`;

    texto.style.top =
        `${255 - y * 16}px`;

    /*
        Pequena variação no tamanho
    */
    texto.style.fontSize =
        `${13 + Math.random() * 5}px`;

    heart.appendChild(texto);
}


/*
    Abre a página
*/
function abrir() {

    const inicio =
        document.getElementById("inicio");

    const conteudo =
        document.getElementById("conteudo");

    inicio.style.opacity = "0";

    setTimeout(() => {

        inicio.style.display = "none";

        conteudo.style.display = "flex";

    }, 1000);
}

</script>

</body>
  </html>
